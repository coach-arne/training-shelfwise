server:
  port: 8080

spring:
  application:
    name: shelfwise
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shelfwise}
    username: ${DB_USER:shelfwise}
    password: ${DB_PASSWORD:shelfwise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

shelfwise:
  training-mode: ${SHELFWISE_TRAINING_MODE:false}
  time-zone: ${TZ:Europe/Brussels}
  portal-url: ${SHELFWISE_PORTAL_URL:http://localhost:4200/portal}
  jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}
  jwt-expiry-hours: 12
  seed-on-empty: true
  scheduler-enabled: ${SHELFWISE_SCHEDULER_ENABLED:true}
  daily-processing-cron: "0 0 22 * * *"
  # Fixed business parameters live in RulesProperties (shelfwise.rules.*) and can be overridden here.
