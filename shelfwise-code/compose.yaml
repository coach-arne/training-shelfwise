name: shelfwise

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shelfwise
      POSTGRES_USER: shelfwise
      POSTGRES_PASSWORD: shelfwise
      TZ: Europe/Brussels
    ports:
      - "5432:5432"
    volumes:
      - shelfwise-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfwise -d shelfwise"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/shelfwise
      DB_USER: shelfwise
      DB_PASSWORD: shelfwise
      JWT_SECRET: change-me-change-me-change-me-change-me-0123456789
      SHELFWISE_TRAINING_MODE: "true"
      SHELFWISE_PORTAL_URL: http://localhost:4200/portal
      TZ: Europe/Brussels
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  shelfwise-db:
